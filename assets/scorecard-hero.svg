    <stop offset="1" stop-color="#58d2ff"/>
  </linearGradient>
  <linearGradient id="arc" x1="0" x2="1">
    <stop offset="0" stop-color="#3b6bff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#5fb0ff" stop-opacity=".7"/>
    <stop offset="1" stop-color="#3b6bff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1200" height="540" rx="22"/></clipPath>
  <path id="arcPath" d="M90 300 Q600 -170 1110 300"/>
</defs>
<style>
