<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Governance Scorecard — every bonded validator, graded on whether they actually vote">
  <defs>
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f06"/>
      <stop offset=".55" stop-color="#070a12"/>
      <stop offset="1" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#b57a1d"/>
      <stop offset="1" stop-color="#f2c675"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .fill{transform-box:fill-box;transform-origin:0 50%;animation:fill 6s cubic-bezier(.3,.9,.3,1) infinite}
    @keyframes fill{0%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    .v{animation:v 6s ease-out infinite;opacity:0}
    @keyframes v{0%,8%{opacity:0}14%,88%{opacity:1}100%{opacity:0}}
    .rank{animation:rank 6s ease-out infinite}
    @keyframes rank{0%,10%{fill:#5d6b82}30%,88%{fill:#f2c675}100%{fill:#5d6b82}}
    .arr{animation:nudge 1.4s ease-in-out infinite}
    @keyframes nudge{50%{transform:translateX(6px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#eef3fa" stroke-opacity=".09"/>

  <!-- copy -->
  <text class="mono" x="56" y="70" font-size="12.5" font-weight="600" letter-spacing="4" fill="#e2a63c">GOVERNANCE SCORECARD</text>
  <text class="sans" x="54" y="116" font-size="36" font-weight="800" fill="#eef3fa" letter-spacing="-1">Every bonded validator,</text>
  <text class="sans" x="54" y="158" font-size="36" font-weight="800" fill="#f2c675" letter-spacing="-1">graded on whether they vote.</text>
  <text class="sans" x="56" y="196" font-size="15.5" fill="#9aa7bd">Rebuilt from public on-chain history since mainnet genesis.</text>
  <g class="mono" font-size="12" font-weight="700" letter-spacing="2">
    <text x="56" y="250" fill="#eef3fa">OPEN THE LEADERBOARD</text>
    <text class="arr" x="262" y="250" fill="#e2a63c">→</text>
  </g>

  <!-- illustrative leaderboard -->
  <rect x="640" y="36" width="520" height="228" rx="14" fill="#03060c" fill-opacity=".7" stroke="#eef3fa" stroke-opacity=".1"/>
  <g class="mono" font-size="10.5" fill="#5d6b82" letter-spacing="2">
    <text x="664" y="66">#</text><text x="700" y="66">PARTICIPATION</text><text x="1000" y="66">VOTES</text>
  </g>
  <line x1="664" y1="78" x2="1136" y2="78" stroke="#eef3fa" stroke-opacity=".08"/>

  <!-- row template: rank · bar · vote ticks -->
  <g>
    <text class="mono rank" x="664" y="106" font-size="13" font-weight="700">01</text>
    <rect x="700" y="96" width="280" height="12" rx="6" fill="#eef3fa" fill-opacity=".05"/>
    <rect class="fill" x="700" y="96" width="276" height="12" rx="6" fill="url(#bar)"/>
    <g fill="#3ddc97"><rect class="v" x="1000" y="96" width="12" height="12" rx="3" style="animation-delay:.1s"/><rect class="v" x="1016" y="96" width="12" height="12" rx="3" style="animation-delay:.2s"/><rect class="v" x="1032" y="96" width="12" height="12" rx="3" style="animation-delay:.3s"/><rect class="v" x="1048" y="96" width="12" height="12" rx="3" style="animation-delay:.4s"/><rect class="v" x="1064" y="96" width="12" height="12" rx="3" style="animation-delay:.5s"/><rect class="v" x="1080" y="96" width="12" height="12" rx="3" style="animation-delay:.6s"/><rect class="v" x="1096" y="96" width="12" height="12" rx="3" style="animation-delay:.7s"/><rect class="v" x="1112" y="96" width="12" height="12" rx="3" style="animation-delay:.8s"/></g>
  </g>
  <g>
    <text class="mono rank" x="664" y="142" font-size="13" font-weight="700" style="animation-delay:.15s">02</text>
    <rect x="700" y="132" width="280" height="12" rx="6" fill="#eef3fa" fill-opacity=".05"/>
    <rect class="fill" x="700" y="132" width="248" height="12" rx="6" fill="url(#bar)" style="animation-delay:.15s"/>
    <g fill="#3ddc97"><rect class="v" x="1000" y="132" width="12" height="12" rx="3" style="animation-delay:.2s"/><rect class="v" x="1016" y="132" width="12" height="12" rx="3" style="animation-delay:.3s"/><rect class="v" x="1032" y="132" width="12" height="12" rx="3" style="animation-delay:.4s"/><rect class="v" x="1048" y="132" width="12" height="12" rx="3" fill="#e2a63c" style="animation-delay:.5s"/><rect class="v" x="1064" y="132" width="12" height="12" rx="3" style="animation-delay:.6s"/><rect class="v" x="1080" y="132" width="12" height="12" rx="3" style="animation-delay:.7s"/><rect class="v" x="1096" y="132" width="12" height="12" rx="3" style="animation-delay:.8s"/><rect class="v" x="1112" y="132" width="12" height="12" rx="3" fill="#2a3b58" style="animation-delay:.9s"/></g>
  </g>
  <g>
    <text class="mono rank" x="664" y="178" font-size="13" font-weight="700" style="animation-delay:.3s">03</text>
    <rect x="700" y="168" width="280" height="12" rx="6" fill="#eef3fa" fill-opacity=".05"/>
    <rect class="fill" x="700" y="168" width="196" height="12" rx="6" fill="url(#bar)" style="animation-delay:.3s"/>
    <g fill="#3ddc97"><rect class="v" x="1000" y="168" width="12" height="12" rx="3" style="animation-delay:.3s"/><rect class="v" x="1016" y="168" width="12" height="12" rx="3" fill="#2a3b58" style="animation-delay:.4s"/><rect class="v" x="1032" y="168" width="12" height="12" rx="3" style="animation-delay:.5s"/><rect class="v" x="1048" y="168" width="12" height="12" rx="3" style="animation-delay:.6s"/><rect class="v" x="1064" y="168" width="12" height="12" rx="3" fill="#ff5a5f" style="animation-delay:.7s"/><rect class="v" x="1080" y="168" width="12" height="12" rx="3" fill="#2a3b58" style="animation-delay:.8s"/><rect class="v" x="1096" y="168" width="12" height="12" rx="3" style="animation-delay:.9s"/><rect class="v" x="1112" y="168" width="12" height="12" rx="3" style="animation-delay:1s"/></g>
  </g>
  <g>
    <text class="mono rank" x="664" y="214" font-size="13" font-weight="700" style="animation-delay:.45s">04</text>
    <rect x="700" y="204" width="280" height="12" rx="6" fill="#eef3fa" fill-opacity=".05"/>
    <rect class="fill" x="700" y="204" width="112" height="12" rx="6" fill="url(#bar)" style="animation-delay:.45s"/>
    <g fill="#2a3b58"><rect class="v" x="1000" y="204" width="12" height="12" rx="3" style="animation-delay:.4s"/><rect class="v" x="1016" y="204" width="12" height="12" rx="3" fill="#3ddc97" style="animation-delay:.5s"/><rect class="v" x="1032" y="204" width="12" height="12" rx="3" style="animation-delay:.6s"/><rect class="v" x="1048" y="204" width="12" height="12" rx="3" style="animation-delay:.7s"/><rect class="v" x="1064" y="204" width="12" height="12" rx="3" fill="#3ddc97" style="animation-delay:.8s"/><rect class="v" x="1080" y="204" width="12" height="12" rx="3" style="animation-delay:.9s"/><rect class="v" x="1096" y="204" width="12" height="12" rx="3" fill="#3ddc97" style="animation-delay:1s"/><rect class="v" x="1112" y="204" width="12" height="12" rx="3" style="animation-delay:1.1s"/></g>
  </g>
  <g class="mono" font-size="10" fill="#5d6b82" letter-spacing="1.5">
    <rect x="664" y="236" width="9" height="9" rx="2" fill="#3ddc97"/><text x="680" y="244">YES</text>
    <rect x="720" y="236" width="9" height="9" rx="2" fill="#ff5a5f"/><text x="736" y="244">NO</text>
    <rect x="770" y="236" width="9" height="9" rx="2" fill="#e2a63c"/><text x="786" y="244">ABSTAIN</text>
    <rect x="860" y="236" width="9" height="9" rx="2" fill="#2a3b58"/><text x="876" y="244">DID NOT VOTE</text>
    <text x="1136" y="244" text-anchor="end">ILLUSTRATIVE</text>
  </g>
</svg>
