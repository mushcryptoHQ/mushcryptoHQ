<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 112" width="400" height="112" role="img" aria-label="Osmosis governance scorecard">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="16"/>
</filter>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#0a1230"/>
    <stop offset="1" stop-color="#050915"/>
  </linearGradient>
</defs>
<style>
  .go{animation:go 1.5s ease-in-out infinite}
  @keyframes go{50%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="399" height="111" rx="20" fill="url(#bg)" stroke="#d38bff" stroke-opacity=".35"/>
<g transform="translate(60 56)">
<defs>
  <radialGradient id="bfill" cx=".5" cy=".38" r=".62">
    <stop offset="0" stop-color="#a03cff"/>
    <stop offset="1" stop-color="#300a63"/>
  </radialGradient>
</defs>
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" begin="0s" repeatCount="indefinite"/>
  <circle r="48" fill="#d38bff" filter="url(#bigglow)" opacity=".45">
    <animate attributeName="opacity" values=".3;.65;.3" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="34" fill="url(#bfill)"/>
  <circle r="34" fill="none" stroke="#d38bff" stroke-width="3" filter="url(#glow)"/>
  <circle r="28" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <ellipse cx="-11.9" cy="-17" rx="12.92" ry="5.44" transform="rotate(-30 -11.9 -17)" fill="#fff" fill-opacity=".09"/>
  <g transform="scale(0.415)">
<defs>
  <clipPath id="bbulb"><circle cx="0" cy="12" r="35"/></clipPath>
  <linearGradient id="bliq" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c46bff"/>
    <stop offset="1" stop-color="#3b2bff"/>
  </linearGradient>
</defs>
<g transform="rotate(14)">
  <g clip-path="url(#bbulb)">
    <g>
      <path d="M-120 14 Q-110 6 -100 14 T-80 14 T-60 14 T-40 14 T-20 14 T0 14 T20 14 T40 14 T60 14 T80 14 T100 14 T120 14 V60 H-120 Z" fill="url(#bliq)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 0" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle cx="-8" cy="40" r="3.5" fill="#fff" fill-opacity=".8"><animate attributeName="cy" values="44;14" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="40" r="2.5" fill="#fff" fill-opacity=".8"><animate attributeName="cy" values="44;16" dur="1.7s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.7s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="2" cy="40" r="2" fill="#fff" fill-opacity=".8"><animate attributeName="cy" values="44;18" dur="2.6s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M-11 -24 V-46 M11 -24 V-46" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M-11 -24 A38 38 0 1 0 11 -24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <rect x="-17" y="-55" width="34" height="10" rx="5" fill="none" stroke="#fff" stroke-width="4"/>
  <path d="M-22 -4 A28 28 0 0 0 -26 22" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5" stroke-linecap="round"/>
</g>
  </g>
</g>
</g>
<text x="114" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f6fd">Osmosis</text>
<g class="go"><text x="115" y="78" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing="2" fill="#d38bff">OPEN SCORECARD &#8594;</text></g>
</svg>