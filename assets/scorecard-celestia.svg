<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 112" width="400" height="112" role="img" aria-label="Celestia governance scorecard">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="16"/>
</filter>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#0a1230"/>
    <stop offset="1" stop-color="#050915"/>
  </linearGradient>
</defs>
<style>
  .go{animation:go 1.5s ease-in-out infinite}
  @keyframes go{50%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="399" height="111" rx="20" fill="url(#bg)" stroke="#b98bff" stroke-opacity=".35"/>
<g transform="translate(60 56)">
<defs>
  <radialGradient id="bfill" cx=".5" cy=".38" r=".62">
    <stop offset="0" stop-color="#8a3dff"/>
    <stop offset="1" stop-color="#2a0a6b"/>
  </radialGradient>
</defs>
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" begin="0s" repeatCount="indefinite"/>
  <circle r="48" fill="#b98bff" filter="url(#bigglow)" opacity=".45">
    <animate attributeName="opacity" values=".3;.65;.3" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="34" fill="url(#bfill)"/>
  <circle r="34" fill="none" stroke="#b98bff" stroke-width="3" filter="url(#glow)"/>
  <circle r="28" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <ellipse cx="-11.9" cy="-17" rx="12.92" ry="5.44" transform="rotate(-30 -11.9 -17)" fill="#fff" fill-opacity=".09"/>
  <g transform="scale(0.415)">
<g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
  <circle r="42"/>
  <ellipse rx="42" ry="42"><animate attributeName="rx" values="42;4;42" dur="5s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="4" ry="42"><animate attributeName="rx" values="4;42;4" dur="5s" repeatCount="indefinite"/></ellipse>
  <ellipse rx="42" ry="14"/>
  <g transform="rotate(-28)">
    <ellipse rx="62" ry="20" stroke-width="3" stroke-opacity=".85"/>
    <circle r="5" fill="#fff" stroke="none"><animateMotion dur="3s" repeatCount="indefinite" path="M62 0 A62 20 0 1 1 -62 0 A62 20 0 1 1 62 0"/></circle>
  </g>
  <circle r="5" fill="#fff" stroke="none"/>
</g>
  </g>
</g>
</g>
<text x="114" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f6fd">Celestia</text>
<g class="go"><text x="115" y="78" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing="2" fill="#b98bff">OPEN SCORECARD &#8594;</text></g>
</svg>