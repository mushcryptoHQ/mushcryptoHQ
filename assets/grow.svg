<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="How we grow: 01 Spore, 02 Mycelium, 03 Fruiting body">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c675"/>
      <stop offset="1" stop-color="#b57a1d"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#00b6fd" stop-opacity="0"/>
      <stop offset="1" stop-color="#00b6fd"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .card{fill:#0a1020;stroke:#eef3fa;stroke-opacity:.09}
    .eye{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;fill:#00b6fd}
    .ttl{font:800 26px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#eef3fa;letter-spacing:-.4px}
    .txt{font:400 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9aa7bd}
    .led{animation:led 1.2s steps(2) infinite}
    @keyframes led{50%{fill:#1b2a40}}
    .orbit{transform-origin:190px 66px;animation:spin 5s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .mesh{fill:none;stroke:#00b6fd;stroke-width:1.6;stroke-opacity:.7;stroke-dasharray:100;stroke-dashoffset:100;animation:mesh 6s ease-in-out infinite}
    @keyframes mesh{0%{stroke-dashoffset:100;opacity:1}35%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    .mn{animation:mn 6s ease-in-out infinite}
    @keyframes mn{0%,5%{opacity:.25}20%,85%{opacity:1}100%{opacity:.25}}
    .stem{transform-box:fill-box;transform-origin:50% 100%;animation:grow 5s cubic-bezier(.3,1.4,.5,1) infinite}
    @keyframes grow{0%{transform:scale(0)}25%,88%{transform:scale(1)}100%{transform:scale(0)}}
    .pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop 5s ease-out infinite}
    @keyframes pop{0%,28%{opacity:0;transform:translateY(8px) scale(.8)}36%,84%{opacity:1;transform:none}92%,100%{opacity:0}}
    .arrow{stroke-dasharray:4 6;animation:march .8s linear infinite}
    @keyframes march{to{stroke-dashoffset:-10}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- ─── 01 SPORE ─── -->
  <rect class="card" x="0.5" y="0.5" width="374" height="319" rx="20"/>
  <g>
    <circle cx="190" cy="66" r="6" fill="none" stroke="#f2c675" stroke-width="1.4">
      <animate attributeName="r" values="6;46" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".9;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="66" r="6" fill="none" stroke="#f2c675" stroke-width="1.4">
      <animate attributeName="r" values="6;46" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".9;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <g class="orbit">
      <circle cx="190" cy="40" r="2" fill="#7fdcff"/>
      <circle cx="214" cy="80" r="1.6" fill="#7fdcff"/>
      <circle cx="166" cy="80" r="1.4" fill="#7fdcff"/>
    </g>
    <circle cx="190" cy="66" r="7" fill="#f2c675" filter="url(#g)"/>
    <!-- validator box -->
    <rect x="140" y="100" width="100" height="44" rx="7" fill="#0f1830" stroke="#eef3fa" stroke-opacity=".18"/>
    <line x1="140" y1="122" x2="240" y2="122" stroke="#eef3fa" stroke-opacity=".12"/>
    <circle class="led" cx="152" cy="111" r="2.6" fill="#3ddc97"/>
    <circle class="led" cx="152" cy="133" r="2.6" fill="#3ddc97" style="animation-delay:.6s"/>
    <rect x="162" y="109" width="56" height="4" rx="2" fill="#eef3fa" fill-opacity=".12"/>
    <rect x="162" y="131" width="40" height="4" rx="2" fill="#eef3fa" fill-opacity=".12"/>
    <line x1="190" y1="74" x2="190" y2="100" stroke="#f2c675" stroke-opacity=".5" stroke-dasharray="2 3"/>
  </g>
  <text class="eye" x="32" y="196">01 — SPORE</text>
  <text class="ttl" x="32" y="232">Seed a sensor.</text>
  <text class="txt" x="32" y="264">A lightweight agent drops onto each</text>
  <text class="txt" x="32" y="286">validator — no load, never touches keys.</text>

  <!-- arrow -->
  <path class="arrow" d="M380 80 H408" stroke="#00b6fd" stroke-width="2" fill="none"/>
  <path d="M404 75 L411 80 L404 85" fill="none" stroke="#00b6fd" stroke-width="2"/>

  <!-- ─── 02 MYCELIUM ─── -->
  <rect class="card" x="412.5" y="0.5" width="374" height="319" rx="20"/>
  <g>
    <path class="mesh" pathLength="100" d="M530 58 L575 102"/>
    <path class="mesh" pathLength="100" d="M575 102 L622 48" style="animation-delay:.25s"/>
    <path class="mesh" pathLength="100" d="M622 48 L668 108" style="animation-delay:.5s"/>
    <path class="mesh" pathLength="100" d="M668 108 L700 62" style="animation-delay:.75s"/>
    <path class="mesh" pathLength="100" d="M575 102 L668 108" style="animation-delay:1s"/>
    <path class="mesh" pathLength="100" d="M530 58 L622 48" style="animation-delay:1.2s"/>
    <path class="mesh" pathLength="100" d="M545 132 L575 102" style="animation-delay:1.4s"/>
    <path class="mesh" pathLength="100" d="M545 132 L668 108" style="animation-delay:1.6s"/>
    <path class="mesh" pathLength="100" d="M622 48 L700 62" style="animation-delay:1.8s"/>
    <path class="mesh" pathLength="100" d="M622 48 L622 132 L668 108" style="animation-delay:2s"/>
  </g>
  <g fill="#00b6fd" filter="url(#g)">
    <circle class="mn" cx="530" cy="58" r="5"/>
    <circle class="mn" cx="575" cy="102" r="6" style="animation-delay:.25s"/>
    <circle class="mn" cx="622" cy="48" r="5" style="animation-delay:.5s"/>
    <circle class="mn" cx="668" cy="108" r="6" style="animation-delay:.75s"/>
    <circle class="mn" cx="700" cy="62" r="4.5" style="animation-delay:1s"/>
    <circle class="mn" cx="545" cy="132" r="4" style="animation-delay:1.4s"/>
    <circle class="mn" cx="622" cy="132" r="4" style="animation-delay:2s"/>
  </g>
  <circle r="2.6" fill="#eef3fa" filter="url(#g)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M530 58 L575 102 L668 108 L700 62 L622 48 L530 58"/>
  </circle>
  <circle r="2.2" fill="#f2c675" filter="url(#g)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M545 132 L575 102 L622 48 L668 108 L622 132 L545 132"/>
  </circle>
  <text class="eye" x="444" y="196">02 — MYCELIUM</text>
  <text class="ttl" x="444" y="232">Grow the mesh.</text>
  <text class="txt" x="444" y="264">Sensors link into a dense mesh that</text>
  <text class="txt" x="444" y="286">shares signal across every network.</text>

  <!-- arrow -->
  <path class="arrow" d="M792 80 H820" stroke="#00b6fd" stroke-width="2" fill="none"/>
  <path d="M816 75 L823 80 L816 85" fill="none" stroke="#00b6fd" stroke-width="2"/>

  <!-- ─── 03 FRUITING BODY ─── -->
  <rect class="card" x="824.5" y="0.5" width="374" height="319" rx="20"/>
  <path d="M900 140 C 960 134, 1060 146, 1120 140" fill="none" stroke="#eef3fa" stroke-opacity=".18"/>
  <g fill="none" stroke="#00b6fd" stroke-opacity=".35" stroke-width="1">
    <path d="M1010 140 C 1000 150, 980 154, 950 160"/>
    <path d="M1010 140 C 1020 152, 1050 156, 1080 162"/>
    <path d="M1010 140 C 1008 150, 1012 158, 1006 168"/>
  </g>
  <g class="stem">
    <path d="M1003 140 L1005 104 L1015 104 L1017 140 Z" fill="#d9cfbf"/>
    <path d="M976 108 Q 976 70 1010 66 Q 1044 70 1044 108 Q 1010 98 976 108 Z" fill="url(#cap)"/>
    <circle cx="996" cy="88" r="3" fill="#7fdcff" opacity=".85"/>
    <circle cx="1022" cy="82" r="2.4" fill="#7fdcff" opacity=".85"/>
    <circle cx="1012" cy="96" r="1.8" fill="#7fdcff" opacity=".85"/>
  </g>
  <g class="pop">
    <rect x="1046" y="30" width="122" height="30" rx="15" fill="#0f1830" stroke="#00b6fd" stroke-opacity=".55"/>
    <circle cx="1063" cy="45" r="4" fill="#ff5a5f"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></circle>
    <text x="1074" y="50" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#eef3fa">alert · 118ms</text>
    <path d="M1056 60 L1046 72 L1068 60 Z" fill="#0f1830"/>
  </g>
  <text class="eye" x="856" y="196">03 — FRUITING BODY</text>
  <text class="ttl" x="856" y="232">See what surfaces.</text>
  <text class="txt" x="856" y="264">One dashboard, clear alerts — the only</text>
  <text class="txt" x="856" y="286">visible part of what's watching below.</text>
</svg>
