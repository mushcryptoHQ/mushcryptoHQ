<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="MushCrypto — the network lives beneath the network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="gText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b6fd"/>
      <stop offset="1" stop-color="#7fdcff"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c675"/>
      <stop offset="1" stop-color="#b57a1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00b6fd" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00b6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="460" rx="22"/></clipPath>

    <path id="p1" pathLength="1000" d="M600 292 C 520 300, 330 300, 230 360"/>
    <path id="p2" pathLength="1000" d="M600 292 C 560 340, 520 380, 480 410"/>
    <path id="p3" pathLength="1000" d="M600 292 C 660 310, 700 320, 760 352"/>
    <path id="p4" pathLength="1000" d="M600 292 C 760 300, 900 340, 980 405"/>
    <path id="p5" pathLength="1000" d="M230 360 C 300 400, 400 420, 480 410"/>
    <path id="p6" pathLength="1000" d="M760 352 C 840 372, 910 400, 980 405"/>
    <path id="p7" pathLength="1000" d="M480 410 C 580 440, 680 380, 760 352"/>
    <path id="t1" pathLength="1000" d="M230 360 C 200 320, 150 300, 140 266"/>
    <path id="t2" pathLength="1000" d="M230 360 C 220 320, 212 290, 205 266"/>
    <path id="t3" pathLength="1000" d="M980 405 C 1000 340, 1012 300, 1010 266"/>
    <path id="t4" pathLength="1000" d="M980 405 C 1040 350, 1060 300, 1062 266"/>
    <path id="t5" pathLength="1000" d="M980 405 C 1080 380, 1110 310, 1112 266"/>
  </defs>

  <style>
    .h{fill:none;stroke:#00b6fd;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.6s cubic-bezier(.6,0,.2,1) forwards}
    .main{stroke-width:2;stroke-opacity:.75}
    .side{stroke-width:1.4;stroke-opacity:.45}
    .tend{stroke:#f2c675;stroke-width:1.2;stroke-opacity:.55}
    .fine{stroke-width:.8;stroke-opacity:.25}
    .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}.d4{animation-delay:1.1s}.d5{animation-delay:1.5s}.d6{animation-delay:1.9s}
    @keyframes draw{to{stroke-dashoffset:0}}

    .rise{opacity:0;animation:rise 1.1s ease-out forwards}
    .r1{animation-delay:.1s}.r2{animation-delay:.35s}.r3{animation-delay:.6s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    .shroom{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:grow 1s cubic-bezier(.3,1.6,.5,1) forwards}
    .s1{animation-delay:2.4s}.s2{animation-delay:2.6s}.s3{animation-delay:2.8s}.s4{animation-delay:3s}.s5{animation-delay:3.2s}
    @keyframes grow{to{transform:scale(1)}}

    .spot{animation:twinkle 2.4s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

    .spore{fill:#7fdcff;animation:float 9s linear infinite}
    @keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-240px);opacity:0}}

    .node{opacity:0;animation:fade .6s ease-out forwards}
    @keyframes fade{to{opacity:1}}

    .label{font:600 11px ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;letter-spacing:2.5px;fill:#9aa7bd}
    @media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-delay:0s!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <ellipse cx="600" cy="300" rx="520" ry="190" fill="url(#glow)"/>

    <!-- drifting spores -->
    <g>
      <circle class="spore" cx="90"  cy="260" r="1.6" style="animation-delay:0s"/>
      <circle class="spore" cx="310" cy="260" r="1.2" style="animation-delay:2.1s"/>
      <circle class="spore" cx="420" cy="260" r="1.8" style="animation-delay:4.4s"/>
      <circle class="spore" cx="680" cy="260" r="1.3" style="animation-delay:1.2s"/>
      <circle class="spore" cx="860" cy="260" r="1.7" style="animation-delay:5.6s"/>
      <circle class="spore" cx="1150" cy="260" r="1.2" style="animation-delay:3.3s"/>
      <circle class="spore" cx="540" cy="260" r="1" style="animation-delay:7s"/>
      <circle class="spore" cx="170" cy="260" r="1.1" style="animation-delay:6.2s"/>
    </g>

    <!-- title -->
    <g text-anchor="middle">
      <text class="rise r1" x="600" y="80" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="600" letter-spacing="6" fill="#00b6fd">INFRASTRUCTURE, UNSEEN</text>
      <text class="rise r2" x="600" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="-2" fill="#eef3fa">Mush<tspan fill="url(#gText)">Crypto</tspan></text>
      <text class="rise r3" x="600" y="208" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#9aa7bd">The network lives <tspan fill="#00b6fd" font-style="italic" font-weight="700">beneath</tspan> the network.</text>
    </g>

    <!-- soil -->
    <path d="M0 266 C 200 256, 400 276, 600 266 S 1000 256, 1200 266 V 460 H 0 Z" fill="url(#soil)"/>
    <path d="M0 266 C 200 256, 400 276, 600 266 S 1000 256, 1200 266" fill="none" stroke="#eef3fa" stroke-opacity=".14" stroke-width="1.2"/>

    <!-- fine decorative hyphae -->
    <g>
      <path pathLength="1000" class="h fine d4" d="M40 330 C 90 320, 150 350, 230 360"/>
      <path pathLength="1000" class="h fine d4" d="M60 430 C 120 400, 170 380, 230 360"/>
      <path pathLength="1000" class="h fine d5" d="M480 410 C 470 440, 430 450, 380 456"/>
      <path pathLength="1000" class="h fine d5" d="M760 352 C 800 330, 860 316, 920 320"/>
      <path pathLength="1000" class="h fine d5" d="M980 405 C 1050 420, 1110 430, 1180 420"/>
      <path pathLength="1000" class="h fine d6" d="M600 292 C 610 330, 630 360, 620 400"/>
      <path pathLength="1000" class="h fine d6" d="M340 300 C 380 320, 420 300, 470 318"/>
    </g>

    <!-- main mycelium -->
    <use xlink:href="#p1" href="#p1" class="h main d1"/>
    <use xlink:href="#p2" href="#p2" class="h main d1"/>
    <use xlink:href="#p3" href="#p3" class="h main d2"/>
    <use xlink:href="#p4" href="#p4" class="h main d2"/>
    <use xlink:href="#p5" href="#p5" class="h side d3"/>
    <use xlink:href="#p6" href="#p6" class="h side d3"/>
    <use xlink:href="#p7" href="#p7" class="h side d4"/>
    <use xlink:href="#t1" href="#t1" class="h tend d5"/>
    <use xlink:href="#t2" href="#t2" class="h tend d5"/>
    <use xlink:href="#t3" href="#t3" class="h tend d5"/>
    <use xlink:href="#t4" href="#t4" class="h tend d6"/>
    <use xlink:href="#t5" href="#t5" class="h tend d6"/>

    <!-- signal pulses -->
    <g filter="url(#blur)">
      <circle r="3" fill="#7fdcff"><animateMotion dur="2.8s" begin="2.6s" repeatCount="indefinite"><mpath xlink:href="#p1" href="#p1"/></animateMotion></circle>
      <circle r="3" fill="#7fdcff"><animateMotion dur="2.2s" begin="3.0s" repeatCount="indefinite"><mpath xlink:href="#p2" href="#p2"/></animateMotion></circle>
      <circle r="3" fill="#7fdcff"><animateMotion dur="2s"   begin="2.8s" repeatCount="indefinite"><mpath xlink:href="#p3" href="#p3"/></animateMotion></circle>
      <circle r="3" fill="#7fdcff"><animateMotion dur="3.1s" begin="3.4s" repeatCount="indefinite"><mpath xlink:href="#p4" href="#p4"/></animateMotion></circle>
      <circle r="2.4" fill="#7fdcff"><animateMotion dur="3.4s" begin="3.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p5" href="#p5"/></animateMotion></circle>
      <circle r="2.4" fill="#7fdcff"><animateMotion dur="3s" begin="4s" repeatCount="indefinite"><mpath xlink:href="#p6" href="#p6"/></animateMotion></circle>
      <circle r="2.4" fill="#7fdcff"><animateMotion dur="3.6s" begin="4.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#p7" href="#p7"/></animateMotion></circle>
      <circle r="2.2" fill="#f2c675"><animateMotion dur="1.6s" begin="3.8s" repeatCount="indefinite"><mpath xlink:href="#t1" href="#t1"/></animateMotion></circle>
      <circle r="2.2" fill="#f2c675"><animateMotion dur="1.9s" begin="4.4s" repeatCount="indefinite"><mpath xlink:href="#t4" href="#t4"/></animateMotion></circle>
      <circle r="2.2" fill="#f2c675"><animateMotion dur="1.7s" begin="5s" repeatCount="indefinite"><mpath xlink:href="#t3" href="#t3"/></animateMotion></circle>
    </g>

    <!-- hub -->
    <g class="node" style="animation-delay:.1s">
      <circle cx="600" cy="292" r="10" fill="none" stroke="#00b6fd" stroke-width="1.5">
        <animate attributeName="r" values="10;34" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="292" r="9" fill="#060a14" stroke="#00b6fd" stroke-width="2.5" filter="url(#blur)"/>
      <circle cx="600" cy="292" r="3.5" fill="#eef3fa"/>
    </g>

    <!-- validator nodes -->
    <g class="node" style="animation-delay:1.6s">
      <circle cx="230" cy="360" r="7" fill="none" stroke="#a46bff" stroke-width="1.5"><animate attributeName="r" values="7;22" dur="2s" begin="0s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="360" r="6" fill="#a46bff" filter="url(#blur)"/>
      <text class="label" x="230" y="392" text-anchor="middle">CELESTIA</text>
    </g>
    <g class="node" style="animation-delay:1.8s">
      <circle cx="480" cy="410" r="7" fill="none" stroke="#eef3fa" stroke-width="1.5"><animate attributeName="r" values="7;22" dur="2s" begin=".5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="410" r="6" fill="#eef3fa" filter="url(#blur)"/>
      <text class="label" x="480" y="442" text-anchor="middle">AXELAR</text>
    </g>
    <g class="node" style="animation-delay:2s">
      <circle cx="760" cy="352" r="7" fill="none" stroke="#ff5a5f" stroke-width="1.5"><animate attributeName="r" values="7;22" dur="2s" begin="1s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="352" r="6" fill="#ff5a5f" filter="url(#blur)"/>
      <text class="label" x="760" y="384" text-anchor="middle">AKASH</text>
    </g>
    <g class="node" style="animation-delay:2.2s">
      <circle cx="980" cy="405" r="7" fill="none" stroke="#e2a63c" stroke-width="1.5"><animate attributeName="r" values="7;22" dur="2s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="405" r="6" fill="#e2a63c" filter="url(#blur)"/>
      <text class="label" x="980" y="437" text-anchor="middle">SHENTU</text>
    </g>

    <!-- fruiting bodies on the surface -->
    <g transform="translate(140 266)"><g class="shroom s1">
      <path d="M-3 0 L-2.4 -16 L2.4 -16 L3 0 Z" fill="#d9cfbf"/>
      <path d="M-15 -14 Q -15 -32 0 -34 Q 15 -32 15 -14 Q 0 -18 -15 -14 Z" fill="url(#cap)"/>
      <circle class="spot" cx="-5" cy="-24" r="1.6" fill="#7fdcff"/><circle class="spot" cx="6" cy="-27" r="1.2" fill="#7fdcff" style="animation-delay:.8s"/>
    </g></g>
    <g transform="translate(205 266) scale(.75)"><g class="shroom s2">
      <path d="M-3 0 L-2.4 -16 L2.4 -16 L3 0 Z" fill="#d9cfbf"/>
      <path d="M-15 -14 Q -15 -32 0 -34 Q 15 -32 15 -14 Q 0 -18 -15 -14 Z" fill="url(#cap)"/>
      <circle class="spot" cx="3" cy="-25" r="1.6" fill="#7fdcff" style="animation-delay:1.4s"/>
    </g></g>
    <g transform="translate(1010 266) scale(1.15)"><g class="shroom s3">
      <path d="M-3 0 L-2.4 -16 L2.4 -16 L3 0 Z" fill="#d9cfbf"/>
      <path d="M-15 -14 Q -15 -32 0 -34 Q 15 -32 15 -14 Q 0 -18 -15 -14 Z" fill="url(#cap)"/>
      <circle class="spot" cx="-6" cy="-23" r="1.5" fill="#7fdcff" style="animation-delay:.4s"/><circle class="spot" cx="5" cy="-28" r="1.3" fill="#7fdcff" style="animation-delay:1.9s"/>
    </g></g>
    <g transform="translate(1062 266) scale(.7)"><g class="shroom s4">
      <path d="M-3 0 L-2.4 -16 L2.4 -16 L3 0 Z" fill="#d9cfbf"/>
      <path d="M-15 -14 Q -15 -32 0 -34 Q 15 -32 15 -14 Q 0 -18 -15 -14 Z" fill="url(#cap)"/>
    </g></g>
    <g transform="translate(1112 266) scale(.9)"><g class="shroom s5">
      <path d="M-3 0 L-2.4 -16 L2.4 -16 L3 0 Z" fill="#d9cfbf"/>
      <path d="M-15 -14 Q -15 -32 0 -34 Q 15 -32 15 -14 Q 0 -18 -15 -14 Z" fill="url(#cap)"/>
      <circle class="spot" cx="0" cy="-26" r="1.6" fill="#7fdcff" style="animation-delay:1s"/>
    </g></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="459" rx="22" fill="none" stroke="#eef3fa" stroke-opacity=".09"/>
</svg>
