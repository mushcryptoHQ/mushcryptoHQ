<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 112" width="400" height="112" role="img" aria-label="Cosmos Hub governance scorecard">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="16"/>
</filter>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#0a1230"/>
    <stop offset="1" stop-color="#050915"/>
  </linearGradient>
</defs>
<style>
  .go{animation:go 1.5s ease-in-out infinite}
  @keyframes go{50%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="399" height="111" rx="20" fill="url(#bg)" stroke="#5fb0ff" stroke-opacity=".35"/>
<g transform="translate(60 56)">
<defs>
  <radialGradient id="bfill" cx=".5" cy=".38" r=".62">
    <stop offset="0" stop-color="#1a5cff"/>
    <stop offset="1" stop-color="#061a4d"/>
  </radialGradient>
</defs>
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="5s" begin="0s" repeatCount="indefinite"/>
  <circle r="48" fill="#5fb0ff" filter="url(#bigglow)" opacity=".45">
    <animate attributeName="opacity" values=".3;.65;.3" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="34" fill="url(#bfill)"/>
  <circle r="34" fill="none" stroke="#5fb0ff" stroke-width="3" filter="url(#glow)"/>
  <circle r="28" fill="none" stroke="#fff" stroke-opacity=".12"/>
  <ellipse cx="-11.9" cy="-17" rx="12.92" ry="5.44" transform="rotate(-30 -11.9 -17)" fill="#fff" fill-opacity=".09"/>
  <g transform="scale(0.415)">
<g fill="none" stroke="#fff" stroke-width="3.5">
  <g transform="rotate(0)"><ellipse rx="56" ry="19"/><circle r="4.5" fill="#fff" stroke="none"><animateMotion dur="2.4s" repeatCount="indefinite" path="M56 0 A56 19 0 1 1 -56 0 A56 19 0 1 1 56 0"/></circle></g>
  <g transform="rotate(60)"><ellipse rx="56" ry="19"/><circle r="4.5" fill="#fff" stroke="none"><animateMotion dur="3.1s" repeatCount="indefinite" path="M56 0 A56 19 0 1 1 -56 0 A56 19 0 1 1 56 0"/></circle></g>
  <g transform="rotate(-60)"><ellipse rx="56" ry="19"/><circle r="4.5" fill="#fff" stroke="none"><animateMotion dur="3.8s" repeatCount="indefinite" path="M56 0 A56 19 0 1 1 -56 0 A56 19 0 1 1 56 0"/></circle></g>
  <circle r="9" fill="#fff" stroke="none"/>
</g>
  </g>
</g>
</g>
<text x="114" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f6fd">Cosmos Hub</text>
<g class="go"><text x="115" y="78" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5fb0ff">OPEN SCORECARD &#8594;</text></g>
</svg>